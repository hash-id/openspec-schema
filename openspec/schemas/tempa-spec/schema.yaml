name: tempa-spec
version: 12
description: Spec-Driven Development that fit againsts Hash SDLC
artifacts:
  - id: discovery
    generates: discovery.md
    description: Discovery session notes - reasoning and decisions behind the change, produced through a relentless interview
    template: discovery.md
    instruction: |
      Produce discovery.md through a relentless interview - do NOT write it first.

      MUST use the `grilling` skill to run the interview. If a question can be answered by exploring the codebase or existing specs in `openspec/specs/`, explore it yourself instead of asking.

      Before starting the interview, if `openspec/BACKLOG.md` exists, read it. Its entries are slices deferred from earlier changes' planning. Use any entry's "Slice" and "Deferred because" lines as context for the interview — do not re-litigate ground an entry already covers. This is read-only context; do not edit or remove entries here. If the file does not exist, continue without comment.

      If shared understanding depends on a fact about something outside this codebase - a third-party API's actual capabilities, a library's documented limits, a standard's spec - and that fact isn't already known with confidence, MUST use the `research` skill to verify it against primary sources before asking the user or writing it into discovery.md as settled. Skip this for facts fully answerable from the codebase itself.

      discovery.md has a scope grilling doesn't know about: the problem statement, what changes, capabilities, and impact are written into proposal.md (next phase) - do NOT duplicate them here. discovery.md records ONLY what proposal and design omit: decisions with rationale and rejected alternatives, desired outcomes, assumptions, and open questions.

      Do NOT proceed to write discovery.md until the user has explicitly confirmed shared understanding has been reached.
      Do not infer confirmation from silence or from answering the last question alone.
      Any recap or confirmation prompt this schema adds beyond grilling's own questions MUST follow the `plain-language-writing` skill's COMMS rules.

      Dark mode: MUST NOT offer, suggest, or mention dark mode proactively, at any point. Only if the user asks for it unprompted, in their own words, MUST use `hrt-dark-mode-opt-in` before continuing.

      Once the interview has converged, write discovery.md from the template. discovery.md is the REASONING log - the why-behind-the-why.
      The proposal phase reads this file as context and produces the contract (Why / What Changes / Capabilities / Impact); technical decisions and risks go in design.md. 
      Prose sections MUST follow the `plain-language-writing` skill's ARTIFACT rules.
    requires: []

  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: |
      Create the proposal document that establishes WHY this change is needed.

      Sections:
      - **Why**: 1-2 sentences on the problem or opportunity. What problem does this solve? Why now?
      - **What Changes**: Bullet list of changes. Be specific about new capabilities, modifications, or removals. Mark breaking changes with **BREAKING**. Before finalizing this list, MUST use the `hrt-change-size-gate` skill to check whether it bundles several independent changes that should be split. In dark mode (`dark.md` exists) that skill's escalation still goes to the user, not `hrt-dark-mode-decision-gate` — same carve-out as the security decisions.
      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<name>/spec.md`. Use kebab-case names (e.g., `user-auth`, `data-export`).
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are changing. Only include if spec-level behavior changes (not just implementation details). Each needs a delta spec file. Check `openspec/specs/` for existing spec names. Leave empty if no requirement changes.
      - **External Dependencies**: One row per out-of-codebase claim the change's feasibility rests on (a third-party API's capability, a library's limit, a standard's requirement). "Verified?" is "yes" only with a primary-source citation or a completed `research` run. Write "none" if fully internal. Any "no" row MUST be resolved with the `research` skill before finalizing.
      - **Impact**: Affected code, APIs, dependencies, or systems.

      IMPORTANT: The Capabilities section is critical. It creates the contract between proposal and specs phases.
      Research existing specs before filling this in. Each capability listed here will need a corresponding spec file.

      The External Dependencies table above is where this is enforced - unverified rows block finalizing. Claims fully answerable from the codebase do not go in the table.

      Keep it concise (1-2 pages). Focus on the "why" not the "how", implementation details belong in design.md.
      This is the foundation - specs, design, and tasks all build on this.

      MUST use the `hrt-adversarial-authoring` skill (artifact: proposal) to draft and adversarially review it before finalizing - nothing else exists yet to check it against.

      Dark mode (`dark.md` exists): a single-reviewer UNANCHORED finding MUST route to `hrt-dark-mode-decision-gate` instead of the user, logged to `dark.md`'s Proposal section. Everything else about `hrt-adversarial-authoring`'s auto-resolve rule is unchanged.
    requires:
      - discovery

  - id: specs
    generates: "specs/**/*.md"
    description: Detailed specifications for the change
    template: spec.md
    instruction: |
      Create specification files that define WHAT the system should do.

      Create one spec file per capability listed in the proposal's Capabilities section.
      - New capabilities: use the exact kebab-case name from the proposal (specs/<capability>/spec.md).
      - Modified capabilities: use the existing spec folder name from openspec/specs/<capability>/ when creating the delta spec at specs/<capability>/spec.md.

      Delta operations (use ## headers):
      - **ADDED Requirements**: New capabilities
      - **MODIFIED Requirements**: Changed behavior - MUST include full updated content
      - **REMOVED Requirements**: Deprecated features - MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format

      Format requirements:
      - Each requirement: `### Requirement: <name>` followed by description
      - Use SHALL/MUST for normative requirements (avoid should/may)
      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format
      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3 hashtags or bullets will fail silently.
      - Every requirement MUST have at least one scenario.

      MODIFIED requirements workflow:
      1. Locate the existing requirement in openspec/specs/<capability>/spec.md
      2. Copy the ENTIRE requirement block (from `### Requirement:` through all scenarios)
      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior
      4. Ensure header text matches exactly (whitespace-insensitive)

      Common pitfall: Using MODIFIED with partial content loses detail at archive time.
      If adding new concerns without changing existing behavior, use ADDED instead.

      Example:
      ```
      ## ADDED Requirements

      ### Requirement: User can export data
      The system SHALL allow users to export their data in CSV format.

      #### Scenario: Successful export
      - **WHEN** user clicks "Export" button
      - **THEN** system downloads a CSV file with all user data

      ## REMOVED Requirements

      ### Requirement: Legacy export
      **Reason**: Replaced by new export system
      **Migration**: Use new export endpoint at /api/v2/export
      ```

      Specs should be testable - each scenario is a potential test case.

      Security requirements (per capability, not per change - a change can add one capability that touches a trust boundary and one that doesn't): check whether the capability touches a trust boundary - new or modified authentication/authorization, external/untrusted input, data exposure or storage, third-party integration, or privilege changes. If it does, SHOULD consider the `security-requirement-extraction` skill's categories when deriving requirements for it, and MUST still write the result as a normal `### Requirement` block above - no second requirement format. If it doesn't touch a trust boundary, the skill MUST NOT be invoked for that capability.

      MUST use the `hrt-adversarial-authoring` skill (artifact: specs) to draft and adversarially review them before finalizing, once all spec files for this change are drafted - `align`'s checks later verify structure and downstream coverage, not whether a requirement is genuinely the right thing to build.

      Dark mode (`dark.md` exists): a single-reviewer UNANCHORED finding from `hrt-adversarial-authoring` MUST route to `hrt-dark-mode-decision-gate` instead of the user, logged to `dark.md`'s Specs section. ANCHORED findings and findings both independent reviewers raised keep auto-resolving as they do outside dark mode.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: |
      Create the design document that explains HOW to implement the change. design.md is MANDATORY for every change - always create it. Depth varies: a cross-cutting change, a new dependency, security/performance/migration complexity, or design ambiguity means full sections; a pure config/data/infra change means thin sections and a one-line "no new code surface" in Shape / Seams. A section that does not apply gets a one-line "N/A - <reason>", never removal.

      Sections:
      - **Context**: Background, current state, constraints, stakeholders
      - **Goals / Non-Goals**: What this design achieves and explicitly excludes
      - **Decisions**: Key technical choices with rationale (why X over Y?). Include alternatives considered for each decision.
      - **Shape / Seams**: required whenever the change introduces callable code. List each seam — the public boundary where `apply`'s tests will attach. For each: its signature, and which spec requirement or scenario has its tests attached there (`Covers: <name>`). Prefer boundaries that already exist in the codebase (explore for them, per `context:`'s rules); add a new seam only when no existing boundary fits, and say why. Skip this section with a one-line note ("no new code surface") only for pure config, data, or infra changes.
      - **Risks / Trade-offs**: Known limitations, things that could go wrong. Format: [Risk] → Mitigation
      - **Migration Plan**: Steps to deploy, rollback strategy (if applicable)
      - **Open Questions**: Outstanding decisions or unknowns to resolve

      Focus on architecture and approach, not line-by-line implementation - the Shape / Seams section above is the one exception, scoped to signatures and file layout, not function bodies.
      Reference the proposal for motivation and specs for requirements.

      Good design docs explain the "why" behind technical decisions.

      Security pass (feeds Risks / Trade-offs): MUST check whether the change touches a trust boundary - new or modified authentication/authorization, external/untrusted input, data exposure or storage, third-party integration, or privilege changes. If none apply, MUST skip the security pass and MAY note the skip in one line; fill Risks / Trade-offs from ordinary (non-security) risk if relevant. If any apply, MUST use the `stride-analysis-patterns` skill for threat identification, then MUST use the `threat-mitigation-mapping` skill to map each identified threat to a mitigation, feeding Risks / Trade-offs as [Threat] → Mitigation entries.

      MUST use the `hrt-adversarial-authoring` skill (artifact: design) to draft and adversarially review it before finalizing - unlike `proposal`/`specs`, this reviews whether the Decisions and Risks/Trade-offs themselves are sound, not whether design.md traces back to the proposal. Fold in any security pass above as part of the Risks / Trade-offs content the draft subagent produces.

      Dark mode (`dark.md` exists): a single-reviewer UNANCHORED finding from `hrt-adversarial-authoring` MUST route to `hrt-dark-mode-decision-gate` instead of the user, logged to `dark.md`'s Design section. ANCHORED findings and findings both independent reviewers raised keep auto-resolving as they do outside dark mode.
    requires:
      - proposal
      - specs

  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: |
      Create the task list that breaks down the implementation work.

      **IMPORTANT: Follow the template below exactly.** The apply phase parses
      checkbox format to track progress. Tasks not using `- [ ]` won't be tracked.

      Guidelines:
      - Group related tasks under ## numbered headings
      - Each heading MUST group tasks that together produce one demoable or verifiable slice - ask what can you demo or verify when everything under this heading is done? A heading with no answer is a horizontal slice (e.g. grouped by architectural layer instead of by behavior) - regroup around behavior instead (exception: wide refactors — see below)
      - Each task MUST be a checkbox: `- [ ] X.Y Task description`
      - Tasks should be small enough to complete in one session
      - Order tasks by dependency (what must be done first?)
      - Note blocking relationships explicitly where non-obvious (e.g. "blocked by 1.2")

      **Wide-refactor exception.** If `design.md` identifies the change as a mechanical edit repeated across many call sites (a rename, a retype, a signature change) where no vertical slice can be demoed as a feature, the demoability-per-heading rule does not apply. Use expand → migrate → contract as sequential headings: `## 1. Expand` (new form added alongside the old), `## 2. Migrate call sites` (in batches; may span several headings), `## 3. Contract` (remove the old form). "Verifiable" for these headings means the test suite stays green, not that a new behavior is visible.

      Where specs (`specs/**/*.md`) define WHEN/THEN scenarios covering both expected and failure behavior, and design.md's Risks/Trade-offs section defines `[Threat] → Mitigation` entries, each MUST trace to at least one task: a scenario or threat with no corresponding task is a coverage gap, not something for `tasks` to silently drop. 
      Tasks tracing to a negative scenario or a threat mitigation SHOULD be tagged distinctly (e.g. a trailing `[negative]` / `[security]` marker) so `align` and the apply-phase review can check coverage without re-deriving it. Keep this lightweight - traceability existing is the MUST, not one-checkbox-per-scenario cardinality.

      MUST NOT include a task for archiving or syncing specs (e.g. `openspec archive`, moving delta specs into `openspec/specs/`). 
      That happens after apply finishes and a human has confirmed the implementation actually matches the specs - putting it in tasks.md risks it being ticked off before the code is verified correct, since apply's TDD loop only checks tasks off as implementation work completes, not as a final correctness gate.

      Example:
      ```
      ## 1. Export CSV for a single table

      - [ ] 1.1 Create export module and CSV formatting utility
      - [ ] 1.2 Wire export command to a single hardcoded table

      ## 2. Export CSV with filters applied

      - [ ] 2.1 Add filter parameter parsing
      - [ ] 2.2 Apply filters before formatting output
      ```

      Reference specs for what needs to be built, design for how to build it.
      Each task should be verifiable - you know when it's done.
    requires:
      - specs
      - design

  - id: align
    generates: align.md
    description: Cross-artifact alignment review - a loop that checks every artifact is consistent with the others and faithful to the requirements, resolving the issues, then a mandatory human walkthrough of every artifact before apply
    template: align.md
    instruction: |
      MUST use the `hrt-align-consistency-review` skill to verify that every artifact is mutually consistent and faithful to the requirements BEFORE any code is written, and to write the findings into align.md.

      When `design.md`'s Shape / Seams section lists real seams (not the "no new code surface" note), the WALKTHROUGH round MUST also point the user at it by name: the seams are the test boundaries the implementation will be built against, and a wrong one is easy to skim past because it reads as a signature, not a behavior. Ask the user to read that section specifically.

      Dark mode (`dark.md` exists): ALIGN's DECISION/HIGH findings MUST route to `hrt-dark-mode-decision-gate` instead of the user, logged to `dark.md`'s Align section. VERIFY and WALKTHROUGH are unchanged - WALKTHROUGH stays the mandatory closing review; the user is just also shown `dark.md`.
    requires:
      - tasks

apply:
  requires:
    - align
  tracks: tasks.md
  instruction: |
    MUST run in a fresh session, not a continuation of discovery-through-align - keeps planning noise out of the implementation context.

    MUST NOT run `git commit` or `git push` - in dark mode or any other mode, the user commits and pushes themselves.

    FIRST, check `dark.md`:
    - Exists, header = +implementation -> SKIP PHASE 0, go directly to PHASE 1. Spawn exactly ONE fresh subagent that runs PHASE 1's loop to completion across all pending tasks - do NOT spawn a new subagent per task. Give it the same context files PHASE 1 already reads below. A seam-mismatch blocker in PHASE 1 routes to `hrt-dark-mode-decision-gate` (logged to `dark.md`'s Apply section), not to the user — the gate can weigh an alternative seam against the code, design, and specs. In PHASE 2, findings MUST route to `hrt-dark-mode-decision-gate` instead of the user, logged to `dark.md`'s Apply section. After PHASE 2, present `dark.md` in full alongside the code diff as a second closing review before the user commits.
    - Exists, header = planning-only -> STOP. Do not run apply in this session. Tell the user planning-only dark mode ends at WALKTHROUGH; apply happens elsewhere.
    - Does not exist -> proceed to PHASE 0 below, unchanged.

    PHASE 0 - SESSION CHECK: if you recall un-recorded planning back-and-forth, still hold raw/superseded draft content, or wrote align.md yourself this conversation - STOP, tell user to start a new session with only align.md + tasks.md. Best-effort only (no way to know which session this is); an actual new session is the real enforcement.
    This stop message and any blocker/pause message in PHASE 1 below MUST follow the `plain-language-writing` skill's COMMS rules.

    Two phases after that: first IMPLEMENT every task with strict TDD, then REVIEW the implementation. Do NOT start the review until every task is [x].

    PHASE 1 - IMPLEMENT (strict TDD, ONE task at a time):
    MUST use the `tdd` skill for seam confirmation, the RED/GREEN loop, and the anti-patterns to avoid (implementation-coupled tests, tautological tests, horizontal slicing). For each pending checkbox task, follow the skill's loop, then tick the checkbox to [x] and move to the next task.
    Override: unlike the `tdd` skill's default (which defers refactoring to the `code-review` review stage), REFACTOR stays inside this loop as step 3 (only while GREEN, never while RED) - tick the checkbox only after it.
    **Seam override.** Seams are already fixed in `design.md`'s Shape / Seams section. This supersedes the seam-confirmation step of the `tdd` skill's loop: do not choose or re-derive a seam. Before each RED test, verify the seam `design.md` names still matches the actual code. A seam that is missing, wrong, or cannot carry a test is a blocker — pause to the user (following the `plain-language-writing` skill's COMMS rules), same as any other PHASE 1 blocker. MUST NOT silently substitute a different seam.
    Context files (discovery.md, proposal.md, specs, design.md) are provided - read them as needed.
    If a test keeps failing after a couple of straightforward attempts, or manual verification of a task shows unexpected behaviour with no obvious cause, MUST use the `diagnosing-bugs` skill instead of continuing to guess - it builds a reproducible feedback loop and ranked hypotheses before another fix attempt. Pause on any other blocker.

    PHASE 2 - REVIEW (only once every task is [x]):
    MUST use the `hrt-apply-code-review` skill to review the implemented code against specs/**/*.md, design.md, and tasks.md, resolving findings before the change is considered done.
